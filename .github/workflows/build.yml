name: AZ VERB build

on:
  push:
    tags: [ 'v*' ]
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build (VST3 + AAX + Standalone)
        run: cmake --build build --config Release --parallel
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\windows\AZVerb.iss
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/AZVerb_artefacts/Release/VST3/AZ VERB.vst3" dist/
          if (Test-Path "build/AZVerb_artefacts/Release/AAX/AZ VERB.aaxplugin") { Copy-Item -Recurse "build/AZVerb_artefacts/Release/AAX/AZ VERB.aaxplugin" dist/ }
          Copy-Item "build/AZVerb_artefacts/Release/Standalone/AZ VERB.exe" dist/
          Copy-Item installer/windows/Output/*.exe dist/
      - uses: actions/upload-artifact@v4
        with: { name: AZ-VERB-Windows, path: dist }

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: "Configure (Universal - Intel + Apple Silicon)"
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build (VST3 + AU + AAX + Standalone)
        run: cmake --build build --config Release --parallel 4
      - name: Package
        run: |
          mkdir -p dist
          cp -R "build/AZVerb_artefacts/Release/VST3/AZ VERB.vst3" dist/
          cp -R "build/AZVerb_artefacts/Release/AU/AZ VERB.component" dist/
          [ -d "build/AZVerb_artefacts/Release/AAX/AZ VERB.aaxplugin" ] && cp -R "build/AZVerb_artefacts/Release/AAX/AZ VERB.aaxplugin" dist/ || true
          cp -R "build/AZVerb_artefacts/Release/Standalone/AZ VERB.app" dist/
          cp installer/macos/ORNATISH.txt dist/
          ditto -c -k --keepParent dist AZ-VERB-macOS.zip
      - uses: actions/upload-artifact@v4
        with: { name: AZ-VERB-macOS, path: AZ-VERB-macOS.zip }

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, macos ]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
      - run: cd AZ-VERB-Windows && zip -r ../AZ-VERB-Windows.zip . && cd ..
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          target_commitish: ${{ github.sha }}
          name: AZ VERB ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.1.0' }}
          body: |
            AZ VERB - Smart Vocal Reverb (Azimxodjayev Music)
            Windows: AZ-VERB-Windows.zip ichida Setup.exe (VST3 + AAX + Standalone)
            macOS: AZ-VERB-macOS.zip (VST3 + AU + AAX + App, Intel va Apple Silicon) - ORNATISH.txt ni o'qing
          files: |
            AZ-VERB-Windows.zip
            AZ-VERB-macOS/AZ-VERB-macOS.zip
